name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: 'loop-app/package-lock.json'
        
    - name: Install dependencies
      working-directory: ./loop-app
      run: npm ci
      
    - name: Typecheck
      working-directory: ./loop-app
      run: npx tsc --noEmit
