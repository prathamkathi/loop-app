name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install app dependencies
        working-directory: ./loop-app
        run: npm ci

      - name: Typecheck app
        working-directory: ./loop-app
        run: npx tsc --noEmit

      - name: Install API dependencies
        run: npm ci

      - name: Typecheck API
        run: npx tsc --noEmit

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Gemini key was previously inlined into the web bundle through an
      # EXPO_PUBLIC_ variable. Fail the build if that class of mistake returns.
      - name: No provider keys in client source
        run: |
          if grep -rnE "EXPO_PUBLIC_(GEMINI|CLOUDINARY_UPLOAD_PRESET|.*API_SECRET)" loop-app/src loop-app/App.tsx; then
            echo "::error::A provider secret is referenced from client code. Move it behind the API."
            exit 1
          fi

      - name: No committed credentials
        run: |
          if git ls-files | grep -qiE 'serviceAccountKey\.json|(^|/)\.env($|\.)|session\.json'; then
            echo "::error::A credential file is tracked by git."
            exit 1
          fi
