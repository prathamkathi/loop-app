name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ./loop-app
        run: npm ci

      - name: Typecheck app & API
        working-directory: ./loop-app
        run: |
          npx tsc --noEmit
          npx tsc --noEmit -p ../api/tsconfig.json

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff -r loop-app/scraper/requirements.txt

      - name: Python syntax compileall
        run: python -m compileall loop-app/scraper

      - name: AST Unresolved Name Check
        run: |
          python3 - <<'PY'
          import ast, builtins, sys
          t = ast.parse(open('loop-app/scraper/scraper.py').read())
          b = set()
          for n in ast.walk(t):
              if isinstance(n, (ast.FunctionDef, ast.ClassDef)): b.add(n.name)
              elif isinstance(n, (ast.Import, ast.ImportFrom)):
                  for a in n.names: b.add(a.asname or a.name.split('.')[0])
              elif isinstance(n, ast.Assign):
                  for x in n.targets:
                      for y in ast.walk(x):
                          if isinstance(y, ast.Name): b.add(y.id)
              elif isinstance(n, ast.arg): b.add(n.arg)
          bad = [(f.func.id, f.lineno) for f in ast.walk(t) if isinstance(f, ast.Call) and isinstance(f.func, ast.Name) and f.func.id not in b and f.func.id not in dir(builtins)]
          if bad:
              print("::error::Unresolved function calls in scraper.py:", bad)
              sys.exit(1)
          print("All functions in scraper.py resolved successfully.")
          PY

      - name: Ruff Lint Check
        run: ruff check loop-app/scraper/shared.py loop-app/scraper/scraper.py

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Gemini key was previously inlined into the web bundle through an
      # EXPO_PUBLIC_ variable. Fail the build if that class of mistake returns.
      - name: No provider keys in client source
        run: |
          if grep -rnE "EXPO_PUBLIC_(GEMINI|CLOUDINARY_UPLOAD_PRESET|.*API_SECRET)" loop-app/src loop-app/App.tsx; then
            echo "::error::A provider secret is referenced from client code. Move it behind the API."
            exit 1
          fi

      - name: No committed credentials
        run: |
          if git ls-files | grep -qiE 'serviceAccountKey\.json|(^|/)\.env($|\.)|session\.json'; then
            echo "::error::A credential file is tracked by git."
            exit 1
          fi
