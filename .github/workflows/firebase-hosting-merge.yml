name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Fail loudly rather than publishing a bundle with an empty Firebase
      # config: a build missing these secrets deploys an app that cannot
      # reach Firestore at all, silently replacing a working site.
      - name: Verify build secrets are configured
        env:
          # Every value the bundle needs. Checking only the service account is
          # not enough: that secret exists, so the guard passed while the
          # EXPO_PUBLIC_* values were empty, and CI deployed a bundle with
          # apiKey:"" over a working site.
          A: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          B: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          C: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          D: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          E: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          for v in A B C D E; do
            if [ -z "${!v}" ]; then
              echo "::error::A required repository secret is empty. Add every EXPO_PUBLIC_FIREBASE_* value and FIREBASE_SERVICE_ACCOUNT under Settings > Secrets and variables > Actions."
              exit 1
            fi
          done
          REQUIRED=set
          if [ -z "$REQUIRED" ]; then
            echo "::error::Repository secrets are not configured. Add the EXPO_PUBLIC_FIREBASE_* values and FIREBASE_SERVICE_ACCOUNT_LOOP_IITD under Settings > Secrets and variables > Actions before this workflow can deploy."
            exit 1
          fi

      # The web bundle inlines every EXPO_PUBLIC_ variable at build time.
      # Only the Firebase client config belongs here — provider secrets live
      # in the Vercel API environment and must never appear in this list.
      - name: Build web bundle
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          EXPO_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.EXPO_PUBLIC_CLOUDINARY_CLOUD_NAME }}
        run: npm ci && npm run build:web

      # Guard against the regression that leaked the Gemini key: refuse to
      # publish a bundle containing anything that looks like a provider key
      # other than the Firebase web API key, which is public by design.
      - name: Scan bundle for leaked secrets
        run: |
          if grep -rq 'apiKey:""' dist; then
            echo "::error::Built bundle has an empty Firebase apiKey — the EXPO_PUBLIC_* secrets did not reach the build."
            exit 1
          fi
          FOUND=$(grep -rhoE "AIza[0-9A-Za-z_-]{35}" dist | sort -u | grep -v "^${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}$" || true)
          if [ -n "$FOUND" ]; then
            echo "::error::Bundle contains an unexpected API key."
            exit 1
          fi
          echo "Bundle clean."

      - name: Deploy Firestore rules and indexes
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > sa.json
          GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/sa.json npx firebase-tools deploy --only firestore:rules,firestore:indexes --project loop-iitd --non-interactive
          rm -f sa.json

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: loop-iitd
          entryPoint: .
