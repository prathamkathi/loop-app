name: Loop Autonomous Scraper

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          cd loop-app/scraper
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Inject Firebase Service Account
        env:
          FIREBASE_SERVICE_ACCOUNT_RAW: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python3 -c "import os, json; data = os.environ['FIREBASE_SERVICE_ACCOUNT_RAW']; json.loads(data); open('loop-app/scraper/serviceAccountKey.json', 'w').write(data)"

      - name: Execute Scraper Pipeline
        env:
          PYTHONUNBUFFERED: "1"
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
        run: |
          cd loop-app/scraper
          python scraper.py
